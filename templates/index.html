<!DOCTYPE html>
<html>

<head>

    <title>Placement Predictor</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

<h1>Placement Predictor</h1>

<form action="/predict" method="POST">

<label>CGPA</label>
<input type="number" step="0.01" name="cgpa" required>

<label>IQ</label>
<input type="number" name="iq" required>

<button type="submit">
Predict Placement
</button>

</form>

{% if prediction %}

<div class="result">

<h2 style="color:red;">Prediction: {{ prediction }}</h2>

</div>

{% endif %}

<div class="footer">

Machine Learning Demo

</div>

</div>

</body>

</html>
